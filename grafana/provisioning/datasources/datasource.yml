# Provisions the PostgreSQL/TimescaleDB datasource used by the Apex
# tactical dashboards. Points at the `postgres` service from
# docker-compose.yml (PostGIS-enabled Postgres; add the TimescaleDB
# extension to the same database if you need hypertables for
# time-series analytics event storage).
apiVersion: 1

datasources:
  - name: Apex PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB:-sharknet}
    user: ${POSTGRES_USER:-sharknet_user}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-sharknet_password}
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true
