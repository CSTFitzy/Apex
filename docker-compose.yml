services:
  postgres:
    image: postgis/postgis:16-3.3
    environment:
      POSTGRES_DB: sharknet
      POSTGRES_USER: sharknet_user
      POSTGRES_PASSWORD: sharknet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sharknet-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sharknet-network

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./server:/app/server
    networks:
      - sharknet-network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
    networks:
      - sharknet-network

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - postgres
    networks:
      - sharknet-network

volumes:
  postgres_data:
  grafana_data:

networks:
  sharknet-network:
    driver: bridge
