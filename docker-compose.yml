services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - apex-network

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/apex_password
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - apex-network

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - NODE_ENV=development
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=apex_password
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - ./server:/app/server
    networks:
      - apex-network

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app/client
    networks:
      - apex-network

volumes:
  postgres_data:
  neo4j_data:

networks:
  apex-network:
    driver: bridge
